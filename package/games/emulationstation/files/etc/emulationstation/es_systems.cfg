<?xml version="1.0"?>
<systemList>
  <system>
    <name>tools</name>
    <fullname>OpenWrt</fullname>
    <path>/usr/share/handheld/tools</path>
    <extension>.sh</extension>
    <command>sh %ROM%</command>
    <platform>ignore</platform>
    <theme>openwrt</theme>
  </system>
  <system>
    <name>gb</name>
    <fullname>Game Boy</fullname>
    <path>/roms/gb</path>
    <extension>.gb .gbc .GB .GBC</extension>
    <command>/usr/bin/handheld-retroarch -L /usr/lib/libretro/gambatte_libretro.so %ROM%</command>
    <platform>gb gbc</platform>
    <theme>gb</theme>
  </system>
</systemList>
