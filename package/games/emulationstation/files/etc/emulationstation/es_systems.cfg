<?xml version="1.0"?>
<systemList>
  <system>
    <name>tools</name>
    <fullname>OpenWrt</fullname>
    <path>/usr/share/handheld/tools</path>
    <extension>.sh</extension>
    <command>sh %ROM%</command>
    <platform>ignore</platform>
    <theme>openwrt</theme>
  </system>
  <system>
    <name>gb</name>
    <fullname>Game Boy</fullname>
    <path>/easyroms/gb</path>
    <extension>.gb .GB</extension>
    <command>/usr/bin/handheld-retroarch gb %ROM%</command>
    <platform>gb</platform>
    <theme>gb</theme>
  </system>
  <system>
    <name>gbc</name>
    <fullname>Game Boy Color</fullname>
    <path>/easyroms/gbc</path>
