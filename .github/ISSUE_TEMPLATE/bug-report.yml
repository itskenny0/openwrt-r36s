name: Hardware or firmware issue
description: Report a problem with the RK3326 OpenWrt port
body:
  - type: input
    id: image
    attributes:
      label: Release and image checksum
      description: Include the image filename, tag or commit, and SHA-256.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Console and panel
      description: Exact model, original or clone, board revision and panel revision if known.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and result
      description: What you did, what happened, and what you expected. Include whether stock firmware works.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and configuration
      description: Relevant dmesg, logread, serial output, boot.env and local build changes. Remove passwords and other private information.
      render: text
  - type: input
    id: peripherals
    attributes:
      label: Connected peripherals
      description: For USB/network issues, include adapter chipset, host OS, cable and USB port.
